<!DOCTYPE html>
<html>
<head>
    <title>Change Password</title>
</head>
<body align="center"></body>>
    <h2>Change Your Password</h2>

    {% if form.errors %}
        <div style="color:red;">
            <ul>
                {% for field in form %}
                    {% for error in field.errors %}
                        <li>{{ error }}</li>
                    {% endfor %}
                {% endfor %}
            </ul>
        </div>
    {% endif %}

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Change Password</button>
    </form>

    <a href="{% url 'profile' %}">Back to Profile</a>
</body>
</html>
