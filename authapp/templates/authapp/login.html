<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div align="center">
        <h1>this is the authentication login pages!!!!!</h1>
        {% if messages %}
            {%for message in messages %}
                <p style="color:red">
                    {{message}}
                </p>
            {% endfor %}
        {% endif %}
        <form action="" method="POST">
            {% csrf_token %}
            <label for="">username</label>
            <label for=""><input type="text" placeholder="user mail" name="username" id="" required></label><br>
            <label for="">password</label>
            <label for=""><input type="password" placeholder="password" name="password" id="" required></label><br>
            <input type="submit" name="" id="" value="Login">
        </form>
        <a href="{% url 'register' %}"><input type="submit" value="back"></a>
    </div>
</body>
</html>
